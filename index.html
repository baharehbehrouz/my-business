<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت هوشمند بیزینس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="pb-20 select-none">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-6 rounded-b-3xl shadow-lg mb-6 sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black">پیشخوان مدیریت</h1>
                <p class="text-[10px] opacity-80" id="current-date"></p>
            </div>
            <div class="bg-white/20 p-2 rounded-full">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            </div>
        </div>
    </header>

    <div id="app" class="px-4">
        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <!-- Stats -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-[10px] mb-1">فروش کل</p>
                    <p class="text-indigo-600 font-black text-sm" id="total-sales">۰ تومان</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-[10px] mb-1">سود خالص</p>
                    <p class="text-emerald-600 font-black text-sm" id="total-profit">۰ تومان</p>
                </div>
            </div>

            <!-- Recent Transactions -->
            <h3 class="text-sm font-bold mb-4 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4 text-slate-400"></i>
                آخرین فاکتورها
            </h3>
            <div id="transaction-list" class="space-y-3">
                <!-- Transactions will appear here -->
            </div>
        </div>

        <!-- Sales Form Tab -->
        <div id="sales" class="tab-content">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold mb-6 text-indigo-700">ثبت فاکتور جدید</h3>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">نام مشتری</label>
                        <input type="text" id="cust-name" class="w-full p-4 bg-slate-50 border-none rounded-xl outline-none focus:ring-2 ring-indigo-500" placeholder="مثلاً: احمدی">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">مبلغ فروش (تومان)</label>
                        <input type="number" id="sale-price" class="w-full p-4 bg-slate-50 border-none rounded-xl outline-none focus:ring-2 ring-indigo-500" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">هزینه خرید/تولید (تومان)</label>
                        <input type="number" id="cost-price" class="w-full p-4 bg-slate-50 border-none rounded-xl outline-none focus:ring-2 ring-indigo-500" placeholder="0">
                    </div>
                    <button onclick="saveTransaction()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-4 shadow-lg active:scale-95 transition-transform">تایید و ثبت نهایی</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-4 left-4 right-4 bg-white/80 backdrop-blur-lg border border-white shadow-2xl rounded-2xl flex justify-around p-3 z-50">
        <button onclick="showTab('dashboard')" id="btn-dashboard" class="flex flex-col items-center text-indigo-600 transition-colors">
            <i data-lucide="home"></i>
            <span class="text-[9px] mt-1 font-bold">داشبورد</span>
        </button>
        <button onclick="showTab('sales')" id="btn-sales" class="flex flex-col items-center text-slate-400 transition-colors">
            <i data-lucide="plus-square"></i>
            <span class="text-[9px] mt-1 font-bold">فاکتور جدید</span>
        </button>
    </nav>

    <script>
        let transactions = JSON.parse(localStorage.getItem('biz_data')) || [];

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            document.getElementById('btn-dashboard').className = tabId === 'dashboard' ? 'flex flex-col items-center text-indigo-600' : 'flex flex-col items-center text-slate-400';
            document.getElementById('btn-sales').className = tabId === 'sales' ? 'flex flex-col items-center text-indigo-600' : 'flex flex-col items-center text-slate-400';
            
            if(tabId === 'dashboard') updateDashboard();
        }

        function saveTransaction() {
            const name = document.getElementById('cust-name').value;
            const price = parseInt(document.getElementById('sale-price').value) || 0;
            const cost = parseInt(document.getElementById('cost-price').value) || 0;

            if(!name || price <= 0) return alert('نام مشتری و مبلغ فروش را وارد کنید');

            const newTx = {
                id: Date.now(),
                customer: name,
                amount: price,
                profit: price - cost,
                date: new Date().toLocaleTimeString('fa-IR')
            };

            transactions.push(newTx);
            localStorage.setItem('biz_data', JSON.stringify(transactions));
            
            document.querySelectorAll('input').forEach(i => i.value = '');
            showTab('dashboard');
        }

        function updateDashboard() {
            const totalSales = transactions.reduce((sum, t) => sum + t.amount, 0);
            const totalProfit = transactions.reduce((sum, t) => sum + t.profit, 0);

            document.getElementById('total-sales').innerText = totalSales.toLocaleString('fa-IR') + ' تومان';
            document.getElementById('total-profit').innerText = totalProfit.toLocaleString('fa-IR') + ' تومان';

            const list = document.getElementById('transaction-list');
            if(transactions.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 text-xs mt-10">هیچ فاکتوری ثبت نشده است</p>';
                return;
            }

            list.innerHTML = transactions.slice().reverse().map(t => `
                <div class="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm border border-slate-50">
                    <div>
                        <p class="text-sm font-bold text-slate-700">${t.customer}</p>
                        <p class="text-[10px] text-slate-400">${t.date}</p>
                    </div>
                    <div class="text-left">
                        <p class="text-sm font-black text-indigo-600">${t.amount.toLocaleString('fa-IR')} ت</p>
                        <p class="text-[9px] text-emerald-500">سود: ${t.profit.toLocaleString('fa-IR')}</p>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long' });
        lucide.createIcons();
        updateDashboard();
    </script>
</body>
</html>
